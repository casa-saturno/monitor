name: Monitor Casa Saturno — rodada automática

# Rodada sem máquina ligada: YouTube (Data API v3) + TikTok (embed público),
# publicação do painel e ALERTA de coleta parada. Instagram roda na rodada
# local (pipeline/rodada_local.sh), que exige sessão logada.
#
# Desenho (desde 20/10/2026), igual ao da rodada local:
#   coletar -> snapshot JSON em pipeline/_coleta/ -> publicar = reaplicar os
#   snapshots sobre origin/main recém-baixado, painel, commit, push; push
#   recusado (a rodada local empurrou no meio) -> volta para origin/main e
#   reaplica. Nunca merge de CSV. Em 25/09 o pull --rebase conflitou e a
#   rodada local ficou 26 dias sem publicar; aqui o mesmo risco existia.
#
# TOLERÂNCIA A INSUMO AUSENTE: falta de secret vira aviso, nunca derruba a
# rodada. O único passo que falha de propósito é o ALERTA, quando alguma
# plataforma está há mais de 36 h sem leitura na base publicada — a falha
# deixa a execução vermelha, gera e-mail do GitHub e abre/atualiza uma issue.

on:
  schedule:
    - cron: "23 11 * * *"  # 11:23 UTC = 8h23 de Brasília (o GitHub atrasa horas; é dele)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-rodada
  cancel-in-progress: false

env:
  LIMITE_HORAS: "36"

jobs:
  rodada:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet openpyxl requests

      # ------------------------------------------------------------------
      # 1. COLETA YOUTUBE -> snapshot. Shorts SEMPRE pelo redirect /shorts/.
      #    Nao toca na base: quem aplica e o passo de publicacao.
      # ------------------------------------------------------------------
      - name: Coleta YouTube (snapshot)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python - <<'PY'
          import csv, datetime, os, sys, zoneinfo
          sys.path.insert(0, "pipeline")
          chave = (os.environ.get("YT_API_KEY") or "").strip()
          if not chave:
              print("::warning::secret YT_API_KEY ausente — coleta do YouTube pulada nesta rodada")
              sys.exit(0)
          import requests, saturno
          from saturno import Post

          TZ = zoneinfo.ZoneInfo("America/Sao_Paulo")
          agora = datetime.datetime.now(TZ)
          COLETA, HOJE = agora.strftime("%Y-%m-%d %H:%M"), agora.strftime("%Y-%m-%d")
          API = "https://www.googleapis.com/youtube/v3"

          canais = []
          with open("pipeline/base/perfis.csv", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  artista = r.get("Artista") or r.get("Artista/Perfil")
                  cid = str(r.get("ID tecnico") or r.get("ID técnico") or "")
                  if r.get("Plataforma") == "YouTube" and r.get("Monitorar?") == "Sim" and cid.startswith("UC"):
                      canais.append((artista, cid))
          print("::notice::canais de YouTube monitorados: %d" % len(canais))

          # ids ja conhecidos: so para decidir se precisa classificar Short x longo
          conhecidos = set()
          with open("pipeline/base/posts.csv", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r.get("Plataforma") == "YouTube":
                      conhecidos.add(r.get("ID do post"))

          coletados = []
          for artista, cid in canais:
              try:
                  pl = requests.get(API + "/playlistItems", timeout=30, params={
                      "part": "contentDetails", "playlistId": "UU" + cid[2:],
                      "maxResults": 15, "key": chave}).json()
                  ids = [i["contentDetails"]["videoId"] for i in pl.get("items", [])]
                  if not ids:
                      print("::warning::%s: playlist de uploads vazia" % artista); continue
                  vs = requests.get(API + "/videos", timeout=30, params={
                      "part": "snippet,statistics", "id": ",".join(ids), "key": chave}).json()
              except Exception as e:
                  print("::warning::%s: falha na Data API (%s)" % (artista, e)); continue
              for v in vs.get("items", []):
                  vid, st, sn = v["id"], v.get("statistics", {}), v["snippet"]
                  pub = datetime.datetime.fromisoformat(sn["publishedAt"].replace("Z", "+00:00")).astimezone(TZ)
                  tipo = None
                  if vid not in conhecidos:
                      try:
                          fin = requests.get("https://www.youtube.com/shorts/" + vid, timeout=20, allow_redirects=True).url
                          tipo = "Short" if "/shorts/" in fin else "Vídeo longo"
                      except Exception:
                          print("::warning::%s: redirect /shorts/ falhou — post novo adiado" % vid); continue
                  coletados.append(Post(
                      artista, "YouTube", pub.strftime("%Y-%m-%d"), pub.strftime("%H:%M"),
                      tipo, vid, titulo=sn.get("title"), url="https://youtu.be/" + vid,
                      views=int(st["viewCount"]) if "viewCount" in st else None,
                      likes=int(st["likeCount"]) if "likeCount" in st else None,
                      coment=int(st["commentCount"]) if "commentCount" in st else None,
                      fonte="yt_api"))
          if not coletados:
              print("::warning::nenhum video coletado"); sys.exit(0)
          caminho = saturno.salvar_snapshot("pipeline/_coleta/yt-%s.json" % agora.strftime("%Y%m%d-%H%M%S"),
                                            coletados, {}, COLETA, HOJE, origem="youtube")
          print("::notice::YouTube: %d videos -> %s" % (len(coletados), caminho))
          PY

      # ------------------------------------------------------------------
      # 2. COLETA TIKTOK -> snapshot (embed publico, sem sessao).
      # ------------------------------------------------------------------
      - name: Coleta TikTok (snapshot)
        continue-on-error: true
        run: |
          python pipeline/coletar_tiktok.py --nao-aplicar \
            --snapshot "pipeline/_coleta/tk-$(date -u +%Y%m%d-%H%M%S).json"

      # ------------------------------------------------------------------
      # 3. PUBLICAR — reaplicar snapshots sobre origin/main, painel, commit,
      #    push. Ate 3 tentativas: se o push for recusado porque a rodada local
      #    publicou no meio, volta para origin/main e reaplica os mesmos
      #    snapshots (eles ficam fora do git e sobrevivem ao reset).
      # ------------------------------------------------------------------
      - name: Publicar (aplicar snapshots, painel, push)
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          SNAPS=(pipeline/_coleta/*.json)
          if [ ${#SNAPS[@]} -eq 0 ]; then
            echo "::warning::nenhum snapshot — nada a publicar"; exit 0
          fi
          for tentativa in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            rm -f pipeline/base_atual.xlsx pipeline/_regen_run.py pipeline/painel_casa_saturno.html pipeline/index.html
            SAIDA="$(python pipeline/aplicar_snapshots.py --csv pipeline/base "${SNAPS[@]}")" || { echo "$SAIDA"; echo "::error::falha ao aplicar snapshots"; exit 1; }
            echo "$SAIDA" | tail -3
            COLETA="$(echo "$SAIDA" | sed -n 's/^COLETA=//p' | tail -1)"
            HOJE="${COLETA:0:10}"
            sed -e "s/^COLETA=\"[^\"]*\"; HOJE=\"[^\"]*\"/COLETA=\"$COLETA\"; HOJE=\"$HOJE\"/" pipeline/regen.py > pipeline/_regen_run.py
            (cd pipeline && python _regen_run.py)
            mv -f pipeline/index.html index.html
            rm -f pipeline/_regen_run.py pipeline/base_atual.xlsx pipeline/painel_casa_saturno.html
            git add index.html pipeline/base
            if git diff --cached --quiet -- pipeline/base; then
              echo "::notice::base inalterada — sem commit"; exit 0
            fi
            git commit --quiet -m "Rodada automatica (Actions) — $COLETA (BRT)"
            if git push --quiet origin HEAD:main; then
              echo "::notice::publicado: Rodada automatica (Actions) — $COLETA (BRT)"; exit 0
            fi
            echo "::warning::push recusado na tentativa $tentativa — o remoto andou; reaplicando"
          done
          echo "::error::nao foi possivel publicar em 3 tentativas"; exit 1

      # ------------------------------------------------------------------
      # 4. ALERTA — coleta parada. Le a base PUBLICADA (origin/main depois do
      #    push) e mede, por plataforma, ha quantas horas foi a ultima leitura.
      #    Acima de LIMITE_HORAS: abre ou atualiza a issue "Coleta parada" e
      #    falha o passo (execucao vermelha + e-mail do GitHub). Tudo sao:
      #    fecha a issue, se houver. Nasceu do buraco de 25/09 a 20/10/2026,
      #    26 dias sem Instagram no painel com o Actions verde o tempo todo.
      # ------------------------------------------------------------------
      - name: Alerta de coleta parada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch --quiet origin main && git checkout --quiet origin/main -- pipeline/base/posts.csv || true
          python - <<'PY'
          import csv, datetime, json, os, sys, zoneinfo, requests
          TZ = zoneinfo.ZoneInfo("America/Sao_Paulo")
          agora = datetime.datetime.now(TZ)
          limite = float(os.environ.get("LIMITE_HORAS", "36"))
          ultima = {}
          with open("pipeline/base/posts.csv", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  p, ul = r.get("Plataforma"), (r.get("Última leitura") or "")[:16]
                  if p in ("YouTube", "Instagram", "TikTok") and ul > ultima.get(p, ""):
                      ultima[p] = ul
          linhas, parados = [], []
          for p in ("YouTube", "Instagram", "TikTok"):
              ul = ultima.get(p)
              if not ul:
                  horas = float("inf")
              else:
                  horas = (agora - datetime.datetime.strptime(ul, "%Y-%m-%d %H:%M").replace(tzinfo=TZ)).total_seconds() / 3600
              estado = "PARADO" if horas > limite else "ok"
              linhas.append("| %s | %s | %.0f h | %s |" % (p, ul or "nunca", horas if horas != float("inf") else 9999, estado))
              if horas > limite:
                  parados.append("%s (%.0f h)" % (p, horas))
          tabela = "| Plataforma | Última leitura | Idade | Estado |\n|---|---|---|---|\n" + "\n".join(linhas)
          print(tabela)

          api = "https://api.github.com/repos/%s/issues" % os.environ["REPO"]
          h = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          rotulo = "coleta-parada"
          abertas = requests.get(api, headers=h, params={"state": "open", "labels": rotulo}, timeout=30).json()
          abertas = abertas if isinstance(abertas, list) else []
          carimbo = agora.strftime("%d/%m/%Y %H:%M")

          if parados:
              titulo = "Coleta parada: " + ", ".join(parados)
              corpo = ("Verificação automática de %s (limite: %.0f h sem leitura).\n\n%s\n\n"
                       "O que olhar: para Instagram, `~/Library/Logs/MonitorSaturno/` no Mac e `git status` em `~/monitor`; "
                       "para YouTube/TikTok, o log desta execução: %s\n\nA issue fecha sozinha quando a coleta voltar."
                       % (carimbo, limite, tabela, os.environ["RUN_URL"]))
              if abertas:
                  n = abertas[0]["number"]
                  requests.patch(api + "/%d" % n, headers=h, json={"title": titulo}, timeout=30)
                  requests.post(api + "/%d/comments" % n, headers=h, json={"body": corpo}, timeout=30)
                  print("::error::coleta parada — issue #%d atualizada" % n)
              else:
                  requests.post(api.replace("/issues", "/labels"), headers=h, timeout=30,
                                json={"name": rotulo, "color": "B60205", "description": "aberta pelo workflow quando uma plataforma fica sem leitura"})
                  r = requests.post(api, headers=h, json={"title": titulo, "body": corpo, "labels": [rotulo]}, timeout=30)
                  print("::error::coleta parada — issue #%s aberta" % r.json().get("number"))
              sys.exit(1)
          for i in abertas:
              requests.post(api + "/%d/comments" % i["number"], headers=h, timeout=30,
                            json={"body": "Coleta normalizada em %s.\n\n%s" % (carimbo, tabela)})
              requests.patch(api + "/%d" % i["number"], headers=h, json={"state": "closed"}, timeout=30)
              print("::notice::issue #%d fechada — coleta normalizada" % i["number"])
          print("::notice::coleta em dia nas 3 plataformas")
          PY
